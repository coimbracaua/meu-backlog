name: Fases 3 e 4 - validacao estatica
on:
  push:
    branches:
      - audit/fases-3-4-main-base
      - feature/discord-rawg-library
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxe JavaScript
        run: |
          node --check js/supabase-phase2.js
          node --check js/app-phase2.js
          node --check js/auth-phase2.js
          node --check js/app-phase3.js
          node --check js/app-phase4.js
          node --check js/auth-phase3.js
          node --check js/auth-phase4.js
          node --check js/app-phase5.js
          node --check api/rawg.js
          node --check tests/fases-3-4.test.cjs
      - name: Testes estaticos
        run: node tests/fases-3-4.test.cjs
