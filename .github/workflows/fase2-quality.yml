name: Fase 2 - Qualidade tecnica

on:
  push:
    branches:
      - audit/fase-2-quality
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
